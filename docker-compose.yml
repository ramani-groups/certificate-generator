version: '3.8'

services:
  app:
    build: .
    container_name: certificate-generator
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      CORS_ORIGIN: http://localhost:3000
      UPLOAD_DIR: /app/backend/uploads
      PHOTOS_DIR: /app/backend/photos
      CERTIFICATES_DIR: /app/backend/certificates
      TEMPLATES_DIR: /app/backend/templates
    volumes:
      - ./backend/photos:/app/backend/photos
      - ./backend/certificates:/app/backend/certificates
      - ./backend/uploads:/app/backend/uploads
      - ./backend/templates:/app/backend/templates
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  photos:
  certificates:
  uploads:
  templates:
